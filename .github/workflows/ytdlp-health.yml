name: yt-dlp Healthcheck

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-ytdlp:
    name: Check yt-dlp extraction against public test video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js runtime for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect public test video with JS runtime
        run: |
          python -c "import downloader, yt_dlp; assert downloader.js_runtime_available(), 'JS runtime not detected'; opts = downloader.get_base_ydl_opts(); opts['skip_download'] = True; ydl = yt_dlp.YoutubeDL(opts); info = ydl.extract_info('https://www.youtube.com/watch?v=jNQXAC9IVRw', download=False); assert info and info.get('title'), 'Extraction failed'"
