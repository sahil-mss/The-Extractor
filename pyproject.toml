[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-extractor"
version = "2.5.0"
description = "A modern, cross-platform media downloader, tag inspector, transcript generator, and audio preparation suite"
readme = "README.md"
authors = [{ name = "Muhammed Sahil Subair" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "aiosqlite>=0.21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
the-extractor = "main:main"
extractor = "main:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
