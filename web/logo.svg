<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Vibrant Play / Extract Gradient -->
    <linearGradient id="extractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soundwave & Orbit Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#312e81" stroke-width="3" filter="url(#softShadow)"/>

  <!-- Subtle Concentric Tech Radar/Rays -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.35"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Media Extraction Play Triangle / Funnel Symbol -->
  <g filter="url(#glow)">
    <!-- Main Angular Extractor Prism (Stylized Play + Downward Prism Extraction) -->
    <path d="M 190 148 C 176 139 160 149 160 166 L 160 346 C 160 363 176 373 190 364 L 334 274 C 347 266 347 246 334 238 Z"
          fill="url(#extractGrad)"/>

    <!-- High-tech Inner Cutout Beam -->
    <path d="M 230 220 L 290 256 L 230 292 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Audio Waveform / Extracted Stream Bars on the Right -->
  <g transform="translate(370, 256)" filter="url(#glow)">
    <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="22" y1="-30" x2="22" y2="30" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <line x1="44" y1="-14" x2="44" y2="14" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="-22" y1="-36" x2="-22" y2="36" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Downward Speed Extraction Arrow Indicator -->
  <path d="M 238 385 L 256 403 L 274 385" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <line x1="256" y1="355" x2="256" y2="400" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Sparkle Particle Accents -->
  <circle cx="340" cy="160" r="4" fill="#38bdf8"/>
  <circle cx="160" cy="120" r="3" fill="#a855f7"/>
  <circle cx="380" cy="350" r="3.5" fill="#ec4899"/>
</svg>
